name: Weekly KPI Export → Google Sheets

on:
  schedule:
    # Every Friday at 17:00 UTC = 19:00 CEST (verano) / 18:00 CET (invierno)
    - cron: '0 17 * * 5'
  workflow_dispatch:   # permite lanzar manualmente desde GitHub Actions

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas gspread google-auth tzdata

      - name: Run weekly export
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python scripts/weekly_export.py

      - name: Commit updated snapshots.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots.json
          git diff --cached --quiet || git commit -m "Weekly KPI snapshot $(date -u +'%Y-W%V')"
          git push